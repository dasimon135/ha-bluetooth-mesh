name: Question
description: Ask about setup, configuration or expected behaviour
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Questions are welcome here - this tracker is the single place where I follow them.

        Two things worth reading first, because they answer a large share of what gets
        asked: the [README](https://github.com/dasimon135/ha-bluetooth-mesh#readme) and
        [Credit and honesty](https://github.com/dasimon135/ha-bluetooth-mesh#credit-and-honesty).
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to do, and what is unclear or not behaving as you expect?
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Home Assistant and integration versions
      placeholder: "HA 2026.8.2, integration 0.6.0"
    validations:
      required: false
  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: Node brand and model, number of nodes, and the proxies in range.
    validations:
      required: false
