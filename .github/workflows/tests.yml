name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Pinned: ruff's default rule set grows between releases, and a lint job
      # that changes shape on its own fails for reasons unrelated to the commit.
      - name: Install ruff
        run: pip install ruff==0.16.0

      - name: Run ruff
        run: ruff check .

  pytest:
    name: pytest (library + HA integration)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 3.14: the pinned pytest-homeassistant-custom-component (and the HA
          # release it pulls in) requires Python >= 3.14.
          python-version: "3.14"

      # The integration ships its own copy of the library (HACS installs
      # custom_components/ as-is). Each tree is imported by a different half of
      # the suite, so drift between them breaks no test — only this check.
      - name: Check the vendored btmesh copy is in sync
        run: python scripts/sync_vendored_btmesh.py --check

      - name: Install the library
        run: pip install -e .

      - name: Install Home Assistant + test dependencies
        run: pip install -r requirements-test.txt

      # No path argument: pyproject's `testpaths` covers tests/ (the library
      # and the HA integration) AND phase0/tests, so the harness suite cannot
      # rot unnoticed the way it did while CI ran `pytest tests`. On Linux the
      # fcntl/resource modules exist natively so the tests/ha/_winshims shims
      # are inert, and Home Assistant is installed so the pytest.importorskip
      # guards in tests/ha do not trigger — the HA tests run for real.
      - name: Run tests
        run: pytest -q
